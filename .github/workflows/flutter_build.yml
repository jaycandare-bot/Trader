name: Flutter CI/CD Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Extract ZIP (Only If Present) & Organize Root
        run: |
          ZIP_FILES=$(find . -maxdepth 3 -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            echo "Found uploaded ZIP archive(s): $ZIP_FILES"
            rm -rf lib/ android/ build/ .dart_tool/
            for z in $ZIP_FILES; do
              echo "Extracting $z into root..."
              unzip -o "$z" -d .
              rm -f "$z"
            done
          else
            echo "No new ZIP archive found; keeping existing lib/ source files."
          fi

          # If a nested subfolder contains lib/main.dart, move it to root
          SUB_MAIN=$(find . -mindepth 3 -maxdepth 4 -path "*/lib/main.dart" | head -n 1)
          if [ -n "$SUB_MAIN" ]; then
            SUB_DIR=$(dirname "$(dirname "$SUB_MAIN")")
            echo "Moving files from $SUB_DIR to root..."
            cp -rf "$SUB_DIR"/. .
            rm -rf "$SUB_DIR"
          fi

          mkdir -p lib
          echo "export 'delta_ict_service.dart';" > lib/delta_service_v2.dart

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-extract latest ZIP release [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Rebuild Clean Android v2 Folder & Compile Release APK
        run: |
          # Back up our custom lib/ and pubspec.yaml so flutter create never overwrites them
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml

          rm -rf android
          flutter create --platforms=android --project-name delta_ict_terminal_v19 --org com.deltatrade.ict .

          # Restore our custom lib/ and pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delta-ICT-Terminal-v19-APK
          path: build/app/outputs/flutter-apk/app-release.apk
