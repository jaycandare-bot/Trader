name: Flutter CI/CD Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Latest ZIP & Purge Any Old Stale Folders
        run: |
          LATEST_ZIP=$(ls -t *.zip */*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_ZIP" ]; then
            echo "Extracting newest ZIP archive: $LATEST_ZIP"
            rm -rf lib/ android/ build/ .dart_tool/
            mkdir -p /tmp/fresh_zip_extract
            unzip -o "$LATEST_ZIP" -d /tmp/fresh_zip_extract
            INNER_MAIN=$(find /tmp/fresh_zip_extract -name "main.dart" | head -n 1)
            if [ -n "$INNER_MAIN" ]; then
              INNER_ROOT=$(dirname "$(dirname "$INNER_MAIN")")
              cp -rf "$INNER_ROOT"/. .
            fi
            rm -rf /tmp/fresh_zip_extract
            find . -maxdepth 3 -name "*.zip" -delete
          else
            echo "No new ZIP archive found; keeping current root lib/ files."
          fi

          mkdir -p lib
          echo "export 'delta_ict_service.dart';" > lib/delta_service_v2.dart

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Extract latest v24 release and purge old archives [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Rebuild Clean Android v2 Folder & Compile Release APK
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml

          rm -rf android
          flutter create --platforms=android --project-name delta_ict_terminal_v24 --org com.deltatrade.ict .

          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delta-ICT-Terminal-v24-APK
          path: build/app/outputs/flutter-apk/app-release.apk
